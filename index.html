<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Your Name] — Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAFA;
    --panel:#FFFFFF;
    --ink:#161616;
    --ink-soft:#6E6E6E;
    --line:#E4E4E4;
    --soft:#F0F0F0;
    --coral:#FF5A5F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Archivo', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:980px; margin:0 auto; padding:0 28px; width:100%;}

  nav{padding:30px 0;}
  nav .wrap{display:flex; justify-content:space-between; align-items:center;}
  .nav-name{font-family:'Fraunces', serif; font-weight:700; font-size:19px;}
  .nav-links{font-size:13.5px; font-weight:600; color:var(--ink-soft);}

  main{
    flex:1;
    display:flex;
    align-items:center;
  }
  .hero{padding:40px 0 80px;}
  .hero-row{
    display:flex;
    align-items:flex-start;
    gap:32px;
  }
  .headshot{
    flex:0 0 400px;
    width:400px;
    height:400px;
    border-radius:12px;
    object-fit:cover;
    display:block;
  }
  .hero-content{flex:1; min-width:0;}
  .kicker{
    display:inline-block;
    font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
    color:var(--coral); background:var(--soft); padding:8px 16px; border-radius:100px;
    margin-bottom:24px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(34px, 6vw, 58px);
    line-height:1.12;
    letter-spacing:-0.01em;
    max-width:680px;
  }
  h1 .accent{color:var(--coral);}
  .hero-sub{margin-top:22px; font-size:17px; color:var(--ink-soft); max-width:480px;}

  .contact-row{
    margin-top:36px; display:flex; gap:12px; flex-wrap:wrap;
  }
  .contact-row a{
    font-size:14px; font-weight:600;
    padding:11px 22px; border-radius:100px;
    border:1.5px solid var(--ink);
    transition:background .15s ease, color .15s ease;
  }
  .contact-row a.primary{
    background:var(--ink); color:var(--panel);
  }
  .contact-row a.primary:hover{background:var(--coral); border-color:var(--coral);}
  .contact-row a:not(.primary):hover{background:var(--soft);}

  footer{padding:28px 0; border-top:1px solid var(--line);}
  footer .wrap{
    display:flex; justify-content:space-between; align-items:center;
    font-size:13px; color:var(--ink-soft); flex-wrap:wrap; gap:10px;
  }

  :focus-visible{outline:2px solid var(--coral); outline-offset:2px;}

  @media (max-width:900px){
    .hero-row{flex-direction:column;}
    .headshot{width:100%; height:auto; aspect-ratio:1/1; max-width:400px;}
  }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="nav-name">First Last</div>
    <div class="nav-links">Product Designer</div>
  </div>
</nav>

<main>
  <div class="wrap">
    <div class="hero">
      <div class="hero-row">
        <img class="headshot" src="images/headshot-placeholder.jpg" alt="[Your Name] headshot placeholder" width="400" height="400">
        <div class="hero-content">
          <span class="kicker">Under Construction</span>
          <h1>The portfolio is being <span class="accent">rebuilt</span>, stay tuned.</h1>
          <p class="hero-sub">New case studies are on the way. Check back soon, or reach out directly in the meantime.</p>

          <div class="contact-row">
            <a href="https://linkedin.com/in/[yourname]" target="_blank" rel="noopener">Message me on LinkedIn</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div>© 2026 [Your Name]</div>
    <div>Site launching soon</div>
  </div>
</footer>

</body>
</html>
